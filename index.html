<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de PDF</title>
<style>
  :root { --bg:#f3f4f6; --panel:#ffffff; --text:#111827; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111827; --panel:#1f2937; --text:#f9fafb; --muted:#9ca3af; --accent:#60a5fa; --border:#374151; --danger:#f87171; }
  }
  :root[data-theme="dark"] { --bg:#111827; --panel:#1f2937; --text:#f9fafb; --muted:#9ca3af; --accent:#60a5fa; --border:#374151; --danger:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
           padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  button, label.btn { font:inherit; padding:6px 12px; border:1px solid var(--border); border-radius:6px;
           background:var(--panel); color:var(--text); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  label.btn.primary, button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .group { display:inline-flex; }
  .group button { border-radius:0; }
  .group button:first-child { border-radius:6px 0 0 6px; }
  .group button:last-child { border-radius:0 6px 6px 0; border-left:none; }
  .group button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #info { color:var(--muted); font-size:14px; margin-left:auto; }
  #hint { padding:8px 16px; font-size:14px; color:var(--muted); text-align:center; }
  #drop { margin:32px 16px; padding:48px 16px; border:2px dashed var(--border); border-radius:12px;
          text-align:center; color:var(--muted); }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #pages { display:flex; flex-direction:column; align-items:center; gap:16px; padding:16px; overflow-x:auto; }
  .page { position:relative; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); flex:none; }
  .page canvas { display:block; }
  .layer { position:absolute; inset:0; }
  /* Cada texto del PDF tiene una caja transparente encima para poder hacer clic y editarlo. */
  .txt { position:absolute; white-space:pre; color:transparent; cursor:text; line-height:1;
         border-radius:2px; outline:none; transform-origin:0 0; }
  .txt:hover { background:rgba(37,99,235,.12); outline:1px solid rgba(37,99,235,.5); }
  .txt.editing, .txt.edited { outline:1px solid var(--accent); }
  .txt.editing { min-width:4px; }
  /* Modo "Seleccionar": los textos no reciben clics, se dibuja un área. */
  body.area .txt { pointer-events:none; }
  body.area .layer { cursor:crosshair; touch-action:none; }
  .img-box { position:absolute; border:1px dashed rgba(37,99,235,.7); display:none; cursor:pointer; }
  body.area .img-box { display:block; }
  .img-box:hover { background:rgba(37,99,235,.12); }
  .sel { position:absolute; border:2px solid var(--accent); background:rgba(37,99,235,.15); pointer-events:none; }
  .moved { position:absolute; cursor:move; outline:1px dashed var(--accent); touch-action:none; }
  body:not(.area) .moved { pointer-events:none; outline:none; }
  .actions { position:absolute; display:flex; gap:4px; z-index:5; }
  .actions button { padding:4px 10px; font-size:14px; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .actions .del { background:var(--danger); border-color:var(--danger); color:#fff; }
  #pagetools { flex-basis:100%; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:14px; }
  #pagetools[hidden] { display:none; }
  #pagetools input[type=text], #pgRanges { font:inherit; padding:6px 8px; border:1px solid var(--border); border-radius:6px;
           background:var(--panel); color:var(--text); max-width:100%; }
  #pages.grid { flex-direction:row; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  .thumb { width:150px; display:flex; flex-direction:column; gap:4px; align-items:center; padding:6px; border-radius:8px;
           cursor:grab; touch-action:none; user-select:none; }
  .thumb canvas { display:block; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); max-width:100%; pointer-events:none; }
  .thumb.marked canvas { outline:3px solid var(--accent); }
  .thumb.dragging { opacity:.35; }
  .thumb.drop-before { box-shadow:-4px 0 0 var(--accent); }
  .thumb.drop-after { box-shadow:4px 0 0 var(--accent); }
  .ghost { position:fixed; z-index:50; pointer-events:none; opacity:.85; transform:rotate(-3deg); }
  .ghost .count { position:absolute; top:-8px; right:-8px; background:var(--accent); color:#fff; border-radius:12px;
                  padding:2px 8px; font-size:13px; font-weight:bold; }
  #pgOrganize.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .page-box { display:flex; flex-direction:column; gap:4px; flex:none; }
  .page-bar { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); }
  .page-bar button { padding:0 8px; font-size:13px; }
  .page-box.marked .page { outline:3px solid var(--accent); }
  label.check { display:inline-flex; align-items:center; gap:4px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Editor de PDF</h1>
  <label class="btn primary">Abrir PDF<input id="file" type="file" accept="application/pdf" hidden></label>
  <span class="group">
    <button id="modeText" class="on" title="Haz clic en un texto para cambiarlo">Texto</button>
    <button id="modeArea" title="Selecciona cuadros, imágenes o firmas para borrarlos o moverlos">Seleccionar</button>
  </span>
  <button id="zoomOut" title="Alejar">−</button>
  <span id="zoomLabel">100%</span>
  <button id="zoomIn" title="Acercar">+</button>
  <button id="undo" disabled title="Deshacer el último cambio">Deshacer</button>
  <label class="check" title="Las páginas con cambios se guardan como imagen: lo borrado o tapado ya no se puede recuperar, pero el texto de esas páginas deja de poder copiarse.">
    <input id="secure" type="checkbox"> Borrado seguro
  </label>
  <button id="download" class="primary" disabled>Descargar PDF</button>
  <span id="info"></span>
  <div id="pagetools" hidden>
    <b>Páginas:</b>
    <button id="pgOrganize" title="Ver miniaturas y arrastrar páginas para cambiar el orden">Organizar</button>
    <button id="pgAll">Marcar todas</button>
    <button id="pgDelete" class="needsel" title="Quita del documento las páginas marcadas">Eliminar</button>
    <button id="pgExtract" class="needsel" title="Descarga un PDF nuevo solo con las páginas marcadas">Extraer</button>
    <label class="btn" title="Agrega las páginas de otro PDF después de la última página marcada, o al final">Añadir PDF<input id="pgAdd" type="file" accept="application/pdf" hidden></label>
    <button id="pgSplit" title="Descarga un ZIP con varios PDFs">Separar</button>
    <input id="pgRanges" placeholder="Rangos, ej: 1-3, 4-6 (vacío = cada página)" size="30">
  </div>
</header>
<div id="hint" hidden></div>
<div id="drop">Arrastra un PDF aquí o pulsa <b>Abrir PDF</b></div>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// edits: clave "página:índice" -> texto original (en unidades PDF) + texto nuevo.
// ops: áreas borradas o movidas, en unidades PDF: {page, x, y, w, h, bg, dx, dy, png}. png solo si se movió.
const state = { pdf: null, bytes: null, name: 'documento.pdf', scale: 1.0, mode: 'text',
                edits: new Map(), ops: [], history: [], selected: new Set(), view: 'pages' };
const $ = id => document.getElementById(id);
const HINTS = {
  grid: 'Arrastra una página para cambiarla de lugar. Si arrastras una página marcada, se mueven juntas todas las marcadas.',
  text: 'Haz clic en cualquier texto para cambiarlo. Pulsa Enter para confirmar o Esc para cancelar.',
  area: 'Arrastra para marcar un área (cuadro, firma, sello) o haz clic en una imagen marcada con línea punteada. Lo movido se puede arrastrar.',
};

async function openFile(file) {
  if (!file || file.type !== 'application/pdf') { alert('Elige un archivo PDF.'); return; }
  state.bytes = new Uint8Array(await file.arrayBuffer());
  state.name = file.name;
  state.edits.clear();
  state.ops = [];
  state.history = [];
  // PDF.js consume el buffer, por eso le pasamos una copia y guardamos el original para pdf-lib.
  state.pdf = await pdfjsLib.getDocument({ data: state.bytes.slice() }).promise;
  state.selected.clear();
  showInfo();
  $('drop').hidden = true;
  $('hint').hidden = false;
  $('pagetools').hidden = false;
  setMode(state.mode);
  updateButtons();
  render();
}

function setMode(mode) {
  state.mode = mode;
  document.body.classList.toggle('area', mode === 'area');
  $('modeText').classList.toggle('on', mode === 'text');
  $('modeArea').classList.toggle('on', mode === 'area');
  $('hint').textContent = HINTS[state.view === 'grid' ? 'grid' : mode];
  $('pgOrganize').classList.toggle('on', state.view === 'grid');
  $('pgOrganize').textContent = state.view === 'grid' ? 'Volver a editar' : 'Organizar';
  document.querySelectorAll('.sel, .actions').forEach(el => el.remove());
}

// Guarda una copia del estado antes de cada cambio para poder deshacerlo.
function remember() {
  state.history.push({ bytes: state.bytes, edits: new Map(state.edits), ops: state.ops.map(o => ({ ...o })) });
}

function showInfo() {
  $('info').textContent = `${state.name} · ${state.pdf.numPages} página(s)`;
}

async function render() {
  if (state.view === 'grid') return renderGrid();
  const container = $('pages');
  container.classList.remove('grid');
  container.innerHTML = '';
  $('zoomLabel').textContent = Math.round(state.scale * 100) + '%';
  const ratio = window.devicePixelRatio || 1;
  for (let n = 1; n <= state.pdf.numPages; n++) {
    const page = await state.pdf.getPage(n);
    const viewport = page.getViewport({ scale: state.scale });
    const wrap = document.createElement('div');
    wrap.className = 'page';
    wrap.dataset.page = n;
    wrap.style.width = viewport.width + 'px';
    wrap.style.height = viewport.height + 'px';
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width * ratio;
    canvas.height = viewport.height * ratio;
    canvas.style.width = viewport.width + 'px';
    canvas.style.height = viewport.height + 'px';
    const layer = document.createElement('div');
    layer.className = 'layer';
    wrap.append(canvas, layer);
    container.appendChild(pageBox(n, wrap));
    await paintPage(page, n, canvas, ratio);
    await buildTextLayer(page, n, viewport, canvas, layer, ratio);
    await buildImageBoxes(page, n, viewport, layer);
    buildMovedPieces(n, viewport, layer);
    enableAreaSelection(n, viewport, canvas, layer, ratio);
  }
}

// Dibuja la página y encima los borrados/movimientos. Sirve para la vista y para recortar en alta resolución.
async function paintPage(page, n, canvas, ratio, scale = state.scale) {
  const viewport = page.getViewport({ scale });
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  await page.render({ canvasContext: ctx, viewport, transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null }).promise;
  const ops = state.ops.filter(o => o.page === n);
  ctx.save();
  ctx.scale(ratio, ratio);
  for (const o of ops) {
    const r = toView(viewport, o.x, o.y, o.w, o.h);
    ctx.fillStyle = css(o.bg);
    ctx.fillRect(r.left, r.top, r.width, r.height);
  }
  for (const o of ops.filter(o => o.png)) {
    const r = toView(viewport, o.x + o.dx, o.y + o.dy, o.w, o.h);
    ctx.drawImage(await loadImage(o.png), r.left, r.top, r.width, r.height);
  }
  ctx.restore();
}

const imageCache = new Map();
function loadImage(src) {
  if (!imageCache.has(src)) imageCache.set(src, new Promise((ok, fail) => {
    const img = new Image(); img.onload = () => ok(img); img.onerror = fail; img.src = src;
  }));
  return imageCache.get(src);
}

// Convierte un rectángulo en unidades PDF (x, y = esquina inferior izquierda) a píxeles de pantalla y viceversa.
function toView(viewport, x, y, w, h) {
  const [x1, y1, x2, y2] = viewport.convertToViewportRectangle([x, y, x + w, y + h]);
  return { left: Math.min(x1, x2), top: Math.min(y1, y2), width: Math.abs(x2 - x1), height: Math.abs(y2 - y1) };
}
function toPdf(viewport, r) {
  const [x1, y1] = viewport.convertToPdfPoint(r.left, r.top);
  const [x2, y2] = viewport.convertToPdfPoint(r.left + r.width, r.top + r.height);
  return { x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) };
}

async function buildTextLayer(page, n, viewport, canvas, layer, ratio) {
  const content = await page.getTextContent();
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  content.items.forEach((item, i) => {
    if (!item.str || !item.str.trim()) return;
    const key = n + ':' + i;
    const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
    const h = Math.hypot(tx[2], tx[3]);
    const box = { left: tx[4], top: tx[5] - h, width: item.width * state.scale, height: h };
    const style = content.styles[item.fontName] || {};
    const span = document.createElement('span');
    span.className = 'txt';
    span.textContent = item.str;
    span.style.left = box.left + 'px';
    span.style.top = box.top + 'px';
    span.style.height = (h * 1.15) + 'px';
    span.style.fontSize = h + 'px';
    span.style.fontFamily = style.fontFamily || 'sans-serif';
    layer.appendChild(span);
    // Ajusta el ancho de la caja al del texto real del PDF.
    const natural = span.getBoundingClientRect().width;
    if (natural > 0 && box.width > 0) span.style.transform = `scaleX(${box.width / natural})`;

    const original = {
      page: n, str: item.str,
      x: item.transform[4], y: item.transform[5],
      size: Math.hypot(item.transform[2], item.transform[3]),
      width: item.width,
      font: fontInfo(page, item.fontName, style),
      ...sampleColors(ctx, box, ratio),
    };
    const edit = state.edits.get(key);
    if (edit) showEdited(span, edit);
    span.addEventListener('click', () => startEditing(span, key, original));
  });
}

// Busca las imágenes de la página (fotos, firmas escaneadas, logos) siguiendo las transformaciones del PDF.
async function buildImageBoxes(page, n, viewport, layer) {
  const { OPS, Util } = pdfjsLib;
  const list = await page.getOperatorList();
  const [, , pw, ph] = page.view;
  let ctm = [1, 0, 0, 1, 0, 0];
  const stack = [];
  list.fnArray.forEach((fn, i) => {
    if (fn === OPS.save) stack.push(ctm);
    else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
    else if (fn === OPS.transform) ctm = Util.transform(ctm, list.argsArray[i]);
    else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintImageMaskXObject) {
      const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(p => Util.applyTransform(p, ctm));
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const x = Math.min(...xs), y = Math.min(...ys), w = Math.max(...xs) - x, h = Math.max(...ys) - y;
      if (w * h > pw * ph * 0.9 || w < 2 || h < 2) return; // ignora fondos de página completa (escaneos)
      const covered = state.ops.some(o => o.page === n && o.x <= x + 1 && o.y <= y + 1 && o.x + o.w >= x + w - 1 && o.y + o.h >= y + h - 1);
      if (covered) return; // ya se borró o movió
      const r = toView(viewport, x, y, w, h);
      const box = document.createElement('div');
      box.className = 'img-box';
      Object.assign(box.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
      box.title = 'Imagen: clic para seleccionarla';
      box.addEventListener('pointerdown', e => e.stopPropagation());
      box.addEventListener('click', e => { e.stopPropagation(); select(n, viewport, layer, r); });
      layer.appendChild(box);
    }
  });
}

// Lo que se movió aparece como una pieza que se puede seguir arrastrando.
function buildMovedPieces(n, viewport, layer) {
  state.ops.forEach((o, idx) => {
    if (o.page !== n || !o.png) return;
    const r = toView(viewport, o.x + o.dx, o.y + o.dy, o.w, o.h);
    const piece = document.createElement('div');
    piece.className = 'moved';
    piece.title = 'Arrastra para mover';
    Object.assign(piece.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    piece.addEventListener('pointerdown', e => {
      e.stopPropagation();
      piece.setPointerCapture(e.pointerId);
      const start = { x: e.clientX, y: e.clientY };
      const move = ev => { piece.style.transform = `translate(${ev.clientX - start.x}px, ${ev.clientY - start.y}px)`; };
      const up = ev => {
        piece.removeEventListener('pointermove', move);
        piece.removeEventListener('pointerup', up);
        const dxPx = ev.clientX - start.x, dyPx = ev.clientY - start.y;
        if (Math.abs(dxPx) + Math.abs(dyPx) < 2) { piece.style.transform = ''; return; }
        remember();
        o.dx += dxPx / state.scale;
        o.dy -= dyPx / state.scale; // en PDF el eje Y crece hacia arriba
        state.ops[idx] = { ...o };
        updateButtons();
        render();
      };
      piece.addEventListener('pointermove', move);
      piece.addEventListener('pointerup', up);
    });
    layer.appendChild(piece);
  });
}

function enableAreaSelection(n, viewport, canvas, layer, ratio) {
  layer.addEventListener('pointerdown', e => {
    if (state.mode !== 'area' || e.target !== layer) return;
    document.querySelectorAll('.sel, .actions').forEach(el => el.remove());
    const origin = layer.getBoundingClientRect();
    const sx = e.clientX - origin.left, sy = e.clientY - origin.top;
    const sel = document.createElement('div');
    sel.className = 'sel';
    layer.appendChild(sel);
    layer.setPointerCapture(e.pointerId);
    let r = { left: sx, top: sy, width: 0, height: 0 };
    const move = ev => {
      const cx = Math.max(0, Math.min(viewport.width, ev.clientX - origin.left));
      const cy = Math.max(0, Math.min(viewport.height, ev.clientY - origin.top));
      r = { left: Math.min(sx, cx), top: Math.min(sy, cy), width: Math.abs(cx - sx), height: Math.abs(cy - sy) };
      Object.assign(sel.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    };
    const up = () => {
      layer.removeEventListener('pointermove', move);
      layer.removeEventListener('pointerup', up);
      sel.remove();
      if (r.width > 4 && r.height > 4) select(n, viewport, layer, r);
    };
    layer.addEventListener('pointermove', move);
    layer.addEventListener('pointerup', up);
  });
}

// Muestra el área elegida con los botones Borrar / Mover.
function select(n, viewport, layer, r) {
  document.querySelectorAll('.sel, .actions').forEach(el => el.remove());
  const sel = document.createElement('div');
  sel.className = 'sel';
  Object.assign(sel.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  const bar = document.createElement('div');
  bar.className = 'actions';
  bar.style.left = r.left + 'px';
  bar.style.top = Math.max(0, r.top - 36) + 'px';
  const btn = (label, cls, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.addEventListener('click', e => { e.stopPropagation(); fn(); });
    bar.appendChild(b);
  };
  btn('Borrar', 'del', () => applyArea(n, viewport, layer, r, false));
  btn('Mover', 'primary', () => applyArea(n, viewport, layer, r, true));
  btn('Cancelar', '', () => { sel.remove(); bar.remove(); });
  layer.append(sel, bar);
}

async function applyArea(n, viewport, layer, r, keepCopy) {
  const canvas = layer.parentElement.querySelector('canvas');
  const ratio = canvas.width / viewport.width;
  const area = toPdf(viewport, r);
  const op = { page: n, ...area, bg: sampleBackground(canvas.getContext('2d', { willReadFrequently: true }), r, ratio), dx: 0, dy: 0, png: null };
  if (keepCopy) {
    // Recorta la pieza en alta resolución para que no se vea borrosa en el PDF final.
    const page = await state.pdf.getPage(n);
    const hiScale = 3;
    const hi = page.getViewport({ scale: hiScale });
    const big = document.createElement('canvas');
    big.width = hi.width; big.height = hi.height;
    await paintPage(page, n, big, 1, hiScale);
    const cr = toView(hi, area.x, area.y, area.w, area.h);
    const piece = document.createElement('canvas');
    piece.width = Math.max(1, Math.round(cr.width)); piece.height = Math.max(1, Math.round(cr.height));
    piece.getContext('2d').drawImage(big, cr.left, cr.top, cr.width, cr.height, 0, 0, piece.width, piece.height);
    op.png = piece.toDataURL('image/png');
    op.dx = 10; op.dy = -10; // se desplaza un poco para que se note que ya se puede arrastrar
  }
  remember();
  state.ops.push(op);
  updateButtons();
  render();
}

// Adivina la familia y si es negrita/cursiva a partir del nombre de la fuente incrustada.
function fontInfo(page, fontName, style) {
  let name = '';
  try { if (page.commonObjs.has(fontName)) name = page.commonObjs.get(fontName).name || ''; } catch (e) {}
  const family = /courier|mono/i.test(name) || style.fontFamily === 'monospace' ? 'Courier'
               : /times|serif|roman|georgia|garamond/i.test(name.replace(/sans/i, '')) || style.fontFamily === 'serif' ? 'Times'
               : 'Helvetica';
  return { family, bold: /bold|black|heavy|semibold/i.test(name), italic: /italic|oblique/i.test(name) };
}

const lum = c => c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114;
function pixel(ctx, x, y, ratio) {
  const cx = Math.min(ctx.canvas.width - 1, Math.max(0, Math.round(x * ratio)));
  const cy = Math.min(ctx.canvas.height - 1, Math.max(0, Math.round(y * ratio)));
  return Array.from(ctx.getImageData(cx, cy, 1, 1).data).slice(0, 3);
}

// El color de fondo es el más claro justo alrededor del área (fuera de ella).
function sampleBackground(ctx, box, ratio) {
  const pts = [];
  for (const f of [0.1, 0.5, 0.9]) {
    pts.push([box.left - 3, box.top + box.height * f], [box.left + box.width + 3, box.top + box.height * f],
             [box.left + box.width * f, box.top - 3], [box.left + box.width * f, box.top + box.height + 3]);
  }
  return pts.map(([x, y]) => pixel(ctx, x, y, ratio)).reduce((a, b) => lum(b) > lum(a) ? b : a);
}

// Toma el color de fondo (para tapar el texto viejo) y el color del texto, mirando los píxeles de la página.
function sampleColors(ctx, box, ratio) {
  const bg = sampleBackground(ctx, box, ratio);
  let fg = bg;
  try {
    const w = Math.max(1, Math.round(box.width * ratio)), h = Math.max(1, Math.round(box.height * ratio));
    const d = ctx.getImageData(Math.round(box.left * ratio), Math.round(box.top * ratio), w, h).data;
    for (let i = 0; i < d.length; i += 4) {
      const c = [d[i], d[i + 1], d[i + 2]];
      if (Math.abs(lum(c) - lum(bg)) > Math.abs(lum(fg) - lum(bg))) fg = c;
    }
  } catch (e) {}
  return { bg, fg };
}

const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;

function showEdited(span, edit) {
  span.textContent = edit.text;
  span.classList.add('edited');
  span.style.color = css(edit.fg);
  span.style.background = css(edit.bg);
  span.style.transform = 'none';
  span.style.fontFamily = { Courier: 'Courier New, monospace', Times: 'Times New Roman, serif', Helvetica: 'Helvetica, Arial, sans-serif' }[edit.font.family];
  span.style.fontWeight = edit.font.bold ? 'bold' : 'normal';
  span.style.fontStyle = edit.font.italic ? 'italic' : 'normal';
}

function startEditing(span, key, original) {
  if (span.isContentEditable) return;
  const before = state.edits.get(key);
  showEdited(span, before || { ...original, text: original.str });
  span.classList.add('editing');
  span.contentEditable = 'plaintext-only';
  span.focus();
  document.getSelection().selectAllChildren(span);

  const finish = (save) => {
    span.removeEventListener('keydown', onKey);
    span.removeEventListener('blur', onBlur);
    span.contentEditable = 'false';
    span.classList.remove('editing');
    const text = span.textContent.replace(/\n/g, ' ');
    const current = before ? before.text : original.str;
    if (save && text !== current) {
      remember();
      state.edits.set(key, { ...original, text });
    }
    updateButtons();
    render();
  };
  const onKey = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
  const onBlur = () => finish(true);
  span.addEventListener('keydown', onKey);
  span.addEventListener('blur', onBlur);
}

async function undo() {
  const last = state.history.pop();
  if (!last) return;
  if (last.bytes !== state.bytes) {
    state.bytes = last.bytes;
    state.pdf = await pdfjsLib.getDocument({ data: state.bytes.slice() }).promise;
    state.selected.clear();
    showInfo();
  }
  state.edits = last.edits;
  state.ops = last.ops;
  updateButtons();
  render();
}

function updateButtons() {
  $('undo').disabled = state.history.length === 0;
  $('download').disabled = !state.pdf;
  if (state.pdf) $('pgAll').textContent = state.selected.size === state.pdf.numPages ? 'Desmarcar todas' : 'Marcar todas';
  document.querySelectorAll('.needsel').forEach(b => { b.disabled = state.selected.size === 0; });
}

// Encima de cada página: casilla para marcarla.
function pageBox(n, wrap) {
  const box = document.createElement('div');
  box.className = 'page-box' + (state.selected.has(n) ? ' marked' : '');
  const bar = document.createElement('div');
  bar.className = 'page-bar';
  const check = document.createElement('label');
  check.className = 'check';
  check.innerHTML = `<input type="checkbox" ${state.selected.has(n) ? 'checked' : ''}> Página ${n}`;
  check.querySelector('input').addEventListener('change', e => {
    e.target.checked ? state.selected.add(n) : state.selected.delete(n);
    box.classList.toggle('marked', e.target.checked);
    updateButtons();
  });
  bar.appendChild(check);
  box.append(bar, wrap);
  return box;
}

const showError = err => alert('Algo salió mal: ' + err.message);

// Arma un PDF nuevo con las páginas indicadas (índices desde 0), en ese orden.
async function pagesToDoc(parts) {
  const out = await PDFLib.PDFDocument.create();
  for (const [doc, indices] of parts) {
    for (const p of await out.copyPages(doc, indices)) out.addPage(p);
  }
  return out;
}

const range = (from, to) => Array.from({ length: Math.max(0, to - from) }, (_, i) => from + i);

// Las operaciones de páginas trabajan sobre el PDF con los cambios ya aplicados,
// y luego ese resultado pasa a ser el documento abierto (se puede deshacer).
async function editedDoc() {
  return PDFLib.PDFDocument.load(await buildEditedBytes());
}

async function replaceDocument(bytes, selected = []) {
  remember();
  state.bytes = bytes;
  state.edits = new Map();
  state.ops = [];
  state.selected = new Set(selected);
  state.pdf = await pdfjsLib.getDocument({ data: state.bytes.slice() }).promise;
  showInfo();
  updateButtons();
  render();
}

function selectedIndices() {
  return [...state.selected].sort((a, b) => a - b).map(n => n - 1);
}

async function deletePages() {
  const total = state.pdf.numPages;
  if (state.selected.size >= total) { alert('No puedes eliminar todas las páginas.'); return; }
  const doc = await editedDoc();
  const keep = range(0, total).filter(i => !state.selected.has(i + 1));
  await replaceDocument(await (await pagesToDoc([[doc, keep]])).save());
}

async function extractPages() {
  const doc = await editedDoc();
  const pages = [...state.selected].sort((a, b) => a - b);
  const bytes = await (await pagesToDoc([[doc, pages.map(n => n - 1)]])).save();
  await saveFile(baseName() + '-paginas-' + compactRanges(pages) + '.pdf', bytes, 'application/pdf');
}

async function addPdf(file) {
  if (!file || file.type !== 'application/pdf') { alert('Elige un archivo PDF.'); return; }
  const other = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
  const doc = await editedDoc();
  const total = doc.getPageCount();
  const after = state.selected.size ? Math.max(...state.selected) : total; // inserta después de esta página
  const out = await pagesToDoc([
    [doc, range(0, after)],
    [other, range(0, other.getPageCount())],
    [doc, range(after, total)],
  ]);
  // Las páginas nuevas quedan marcadas y se abre Organizar, para arrastrarlas a donde se quiera.
  state.view = 'grid';
  setMode(state.mode);
  await replaceDocument(await out.save(), range(after + 1, after + other.getPageCount() + 1));
}

// Mueve las páginas `moving` (números desde 1) para que queden antes de la página `before`
// (o al final si before = total + 1).
async function movePages(moving, before) {
  const total = state.pdf.numPages;
  const rest = range(1, total + 1).filter(n => !moving.includes(n));
  const at = rest.filter(n => n < before).length;
  const order = [...rest.slice(0, at), ...moving, ...rest.slice(at)];
  if (order.every((n, i) => n === i + 1)) { render(); return; }
  const doc = await editedDoc();
  const bytes = await (await pagesToDoc([[doc, order.map(n => n - 1)]])).save();
  // Las páginas marcadas siguen marcadas en su nuevo lugar.
  await replaceDocument(bytes, order.map((orig, i) => state.selected.has(orig) ? i + 1 : 0).filter(Boolean));
}

// Vista Organizar: miniaturas que se arrastran (con mouse o con el dedo).
async function renderGrid() {
  const container = $('pages');
  container.innerHTML = '';
  container.classList.add('grid');
  for (let n = 1; n <= state.pdf.numPages; n++) {
    const page = await state.pdf.getPage(n);
    const viewport = page.getViewport({ scale: 138 / page.getViewport({ scale: 1 }).width });
    const thumb = document.createElement('div');
    thumb.className = 'thumb' + (state.selected.has(n) ? ' marked' : '');
    thumb.dataset.page = n;
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const check = document.createElement('label');
    check.className = 'check';
    check.innerHTML = `<input type="checkbox" ${state.selected.has(n) ? 'checked' : ''}> ${n}`;
    check.addEventListener('pointerdown', e => e.stopPropagation());
    check.querySelector('input').addEventListener('change', e => {
      e.target.checked ? state.selected.add(n) : state.selected.delete(n);
      thumb.classList.toggle('marked', e.target.checked);
      updateButtons();
    });
    thumb.append(canvas, check);
    container.appendChild(thumb);
    thumb.addEventListener('pointerdown', e => startDrag(e, thumb, n));
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  }
}

function startDrag(e, thumb, n) {
  if (e.button > 0) return;
  const start = { x: e.clientX, y: e.clientY };
  const moving = state.selected.has(n) ? [...state.selected].sort((a, b) => a - b) : [n];
  let ghost = null, target = null;
  thumb.setPointerCapture(e.pointerId);
  const clearMarks = () => document.querySelectorAll('.drop-before, .drop-after').forEach(t => t.classList.remove('drop-before', 'drop-after'));
  const move = ev => {
    if (!ghost) {
      if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 6) return;
      ghost = document.createElement('div');
      ghost.className = 'ghost';
      const img = thumb.querySelector('canvas').cloneNode();
      img.getContext('2d').drawImage(thumb.querySelector('canvas'), 0, 0);
      ghost.appendChild(img);
      if (moving.length > 1) ghost.insertAdjacentHTML('beforeend', `<span class="count">${moving.length}</span>`);
      document.body.appendChild(ghost);
      moving.forEach(m => document.querySelector(`.thumb[data-page="${m}"]`)?.classList.add('dragging'));
    }
    ghost.style.left = (ev.clientX + 14) + 'px';
    ghost.style.top = (ev.clientY + 14) + 'px';
    if (ev.clientY < 70) window.scrollBy(0, -15);
    if (ev.clientY > window.innerHeight - 50) window.scrollBy(0, 15);
    // La página bajo el dedo decide el lugar: mitad izquierda = antes, mitad derecha = después.
    const over = document.elementsFromPoint(ev.clientX, ev.clientY).find(el => el.classList?.contains('thumb'));
    clearMarks();
    if (over) {
      const r = over.getBoundingClientRect();
      const after = ev.clientX > r.left + r.width / 2;
      over.classList.add(after ? 'drop-after' : 'drop-before');
      target = +over.dataset.page + (after ? 1 : 0);
    }
  };
  const up = () => {
    thumb.removeEventListener('pointermove', move);
    thumb.removeEventListener('pointerup', up);
    thumb.removeEventListener('pointercancel', up);
    clearMarks();
    if (!ghost) return;
    ghost.remove();
    document.querySelectorAll('.dragging').forEach(t => t.classList.remove('dragging'));
    if (target != null) movePages(moving, target).catch(showError);
  };
  thumb.addEventListener('pointermove', move);
  thumb.addEventListener('pointerup', up);
  thumb.addEventListener('pointercancel', up);
}

function toggleOrganize() {
  state.view = state.view === 'grid' ? 'pages' : 'grid';
  setMode(state.mode);
  render();
}

// "1-3, 5, 7-8" -> [[1,2,3],[5],[7,8]]. Vacío = una parte por página.
function parseRanges(text, total) {
  if (!text.trim()) return range(1, total + 1).map(n => [n]);
  return text.split(/[,;]+/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^(\d+)\s*(?:-\s*(\d+))?$/);
    if (!m) throw new Error(`No entiendo "${s}". Usa algo como 1-3, 4-6`);
    const a = +m[1], b = +(m[2] || m[1]);
    if (a < 1 || b > total || a > b) throw new Error(`"${s}" no es válido: el PDF tiene ${total} página(s).`);
    return range(a, b + 1);
  });
}

function compactRanges(pages) {
  const out = [];
  for (const n of pages) {
    const last = out[out.length - 1];
    if (last && n === last[1] + 1) last[1] = n; else out.push([n, n]);
  }
  return out.map(([a, b]) => a === b ? a : `${a}-${b}`).join('_');
}

async function splitPdf() {
  const doc = await editedDoc();
  const parts = parseRanges($('pgRanges').value, doc.getPageCount());
  const zip = new JSZip();
  for (const pages of parts) {
    const bytes = await (await pagesToDoc([[doc, pages.map(n => n - 1)]])).save();
    zip.file(`${baseName()}-paginas-${compactRanges(pages)}.pdf`, bytes);
  }
  await saveFile(baseName() + '-separado.zip', await zip.generateAsync({ type: 'uint8array' }), 'application/zip');
}

const baseName = () => state.name.replace(/\.pdf$/i, '');

// Dentro de la vista previa de Claude la descarga pasa por su diálogo; en cualquier otra web, descarga normal.
async function saveFile(filename, bytes, type) {
  const claudeDownloads = window.claude?.use ? await window.claude.use('downloads') : null;
  if (claudeDownloads) {
    try { await claudeDownloads.save({ filename, data: bytes }); }
    catch (err) { if (err.code !== 'declined') throw err; }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function download() {
  let bytes = await buildEditedBytes();
  if ($('secure').checked) bytes = await flattenChangedPages(bytes);
  await saveFile(baseName() + '-editado.pdf', bytes, 'application/pdf');
}

// Escribe los cambios en el PDF: tapa lo viejo con el color de fondo y dibuja lo nuevo encima.
async function buildEditedBytes() {
  if (!state.edits.size && !state.ops.length) return state.bytes;
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(state.bytes);
  const fonts = {};
  const getFont = async f => {
    const key = f.family + (f.bold ? 'Bold' : '') + (f.italic ? (f.family === 'Times' ? 'Italic' : 'Oblique') : '');
    const std = { Times: 'TimesRoman', TimesBold: 'TimesRomanBold', TimesItalic: 'TimesRomanItalic', TimesBoldItalic: 'TimesRomanBoldItalic' }[key] || key;
    return fonts[std] ||= await doc.embedFont(StandardFonts[std]);
  };
  const color = c => rgb(c[0] / 255, c[1] / 255, c[2] / 255);
  for (const o of state.ops) {
    doc.getPage(o.page - 1).drawRectangle({ x: o.x, y: o.y, width: o.w, height: o.h, color: color(o.bg) });
  }
  for (const o of state.ops.filter(o => o.png)) {
    const img = await doc.embedPng(o.png);
    doc.getPage(o.page - 1).drawImage(img, { x: o.x + o.dx, y: o.y + o.dy, width: o.w, height: o.h });
  }
  for (const e of state.edits.values()) {
    const page = doc.getPage(e.page - 1);
    const font = await getFont(e.font);
    page.drawRectangle({ x: e.x - 1, y: e.y - e.size * 0.25, width: e.width + 2, height: e.size * 1.2, color: color(e.bg) });
    if (e.text) page.drawText(e.text, { x: e.x, y: e.y, size: e.size, font, color: color(e.fg) });
  }
  return doc.save();
}

// Borrado seguro: las páginas con cambios se vuelven una imagen, así lo tapado desaparece del archivo.
// Se arma un PDF nuevo copiando solo lo necesario, para que no queden restos de las páginas viejas.
async function flattenChangedPages(editedBytes) {
  const { PDFDocument } = PDFLib;
  const changed = new Set([...state.ops.map(o => o.page), ...[...state.edits.values()].map(e => e.page)]);
  const src = await PDFDocument.load(editedBytes);
  const out = await PDFDocument.create();
  const preview = await pdfjsLib.getDocument({ data: editedBytes.slice() }).promise;
  for (let n = 1; n <= src.getPageCount(); n++) {
    if (!changed.has(n)) {
      const [copy] = await out.copyPages(src, [n - 1]);
      out.addPage(copy);
      continue;
    }
    const page = await preview.getPage(n);
    const viewport = page.getViewport({ scale: 2.5 }); // ~180 ppp: nítido al imprimir
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const img = await out.embedJpg(canvas.toDataURL('image/jpeg', 0.92));
    const { width, height } = page.getViewport({ scale: 1 });
    out.addPage([width, height]).drawImage(img, { x: 0, y: 0, width, height });
  }
  return out.save();
}

function zoom(delta) {
  if (!state.pdf) return;
  state.scale = Math.min(3, Math.max(0.5, +(state.scale + delta).toFixed(2)));
  render();
}

$('file').addEventListener('change', e => openFile(e.target.files[0]));
$('modeText').addEventListener('click', () => setMode('text'));
$('modeArea').addEventListener('click', () => setMode('area'));
$('zoomIn').addEventListener('click', () => zoom(0.25));
$('zoomOut').addEventListener('click', () => zoom(-0.25));
$('undo').addEventListener('click', () => undo().catch(showError));
$('pgOrganize').addEventListener('click', toggleOrganize);
$('pgAll').addEventListener('click', () => {
  const all = state.selected.size < state.pdf.numPages;
  state.selected = new Set(all ? range(1, state.pdf.numPages + 1) : []);
  updateButtons();
  render();
});
$('pgDelete').addEventListener('click', () => deletePages().catch(showError));
$('pgExtract').addEventListener('click', () => extractPages().catch(showError));
$('pgAdd').addEventListener('change', e => { addPdf(e.target.files[0]).catch(showError); e.target.value = ''; });
$('pgSplit').addEventListener('click', () => splitPdf().catch(showError));
$('download').addEventListener('click', () => download().catch(err => alert('No se pudo guardar: ' + err.message)));
const drop = $('drop');
['dragover', 'dragenter'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => openFile(e.dataTransfer.files[0]));
</script>
</body>
</html>
